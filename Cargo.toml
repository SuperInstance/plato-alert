[package]
name = "plato-alert"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Alert management for PLATO — creation, routing, acknowledgment, escalation"
repository = "https://github.com/SuperInstance/plato-alert"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
